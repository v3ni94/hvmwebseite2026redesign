; Produktionseinstellungen (ergänzt php.ini-production)

; Fehler nie ausgeben, nur protokollieren (stderr des Containers)
display_errors = Off
display_startup_errors = Off
html_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED

expose_php = Off
date.timezone = Europe/Berlin
default_charset = "UTF-8"

memory_limit = 256M
max_execution_time = 30
max_input_time = 30

; Bewerbungsunterlagen: Nginx erlaubt 12 MB je Anfrage
file_uploads = On
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 5

allow_url_include = Off

; Sitzungen (die Anwendung setzt dieselben Werte zusätzlich beim Start)
session.name = hvm_sid
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.cookie_lifetime = 0
session.gc_maxlifetime = 1800
session.cache_limiter =
session.save_path = /tmp

; OPcache: unveränderliches Image, daher keine Zeitstempelprüfung
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
