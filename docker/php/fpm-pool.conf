; Ergänzung zum Standardpool "www" des offiziellen Images
[www]
; Umgebungsvariablen des Containers (env_file) an PHP weitergeben
clear_env = no

pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Zugriffsprotokoll führt Nginx, keine doppelten Einträge
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
