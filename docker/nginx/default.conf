# Nginx vor PHP-FPM, hinter Traefik (TLS endet bei Traefik).

server_tokens off;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/javascript text/javascript application/json application/xml application/manifest+json image/svg+xml;

map $http_x_forwarded_proto $fastcgi_https {
    default "";
    https on;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 12m;

    # Verborgene Dateien (.env, .git usw.) sperren, außer .well-known
    location ^~ /.well-known/ {
        try_files $uri =404;
    }
    location ~ /\. {
        return 404;
    }

    # Anwendungsverzeichnisse liegen außerhalb des Webroots, zusätzliche Absicherung
    location ~* ^/(storage|config|src|vendor|templates|migrations|bin|tests|docs|resources|content|legacy)(/|$) {
        return 404;
    }

    # Gebaute Assets: Dateinamen bzw. Verzeichnisse enthalten einen Inhalts-Hash
    location ^~ /assets/build/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /assets/build/manifest.json {
        return 404;
    }

    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /og/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Front Controller: alles, was keine vorhandene Datei ist
    location / {
        try_files $uri @php;
    }

    # PHP-Dateien nie direkt ausführen, sondern über den Front Controller leiten
    # (z. B. /wp-login.php liefert dort 410)
    location ~ \.php$ {
        try_files /__nicht_vorhanden__ @php;
    }

    location @php {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTPS $fastcgi_https if_not_empty;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
