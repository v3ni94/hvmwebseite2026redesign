# Deployment hinter dem bestehenden Traefik (IONOS Dedicated Server).
# Variablen aus .env (siehe .env.example). Staging und Produktion laufen als getrennte Compose-Projekte
# mit eigener .env, eigenem TRAEFIK_ROUTER und eigenem APP_HOST.
#
#   docker compose build
#   docker compose up -d
#   docker compose run --rm php php bin/migrate.php
#   docker compose --profile worker up -d worker   (sobald bin/worker.php existiert)

name: ${COMPOSE_PROJECT_NAME:-hvm-website}

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: app
  image: ${HVM_IMAGE:-hvm-website}:${HVM_TAG:-latest}
  env_file:
    - .env
  environment:
    DB_HOST: db
    DB_PORT: "3306"
    # env_file reicht die gesamte .env durch. Das Root-Passwort braucht nur der Dienst db,
    # die Anwendung arbeitet mit DB_USER (minimale Rechte), daher hier leeren.
    DB_ROOT_PASSWORD: ""
  restart: unless-stopped
  volumes:
    # Nur Daten, die Deployments überdauern müssen. storage/cache bleibt im Container,
    # damit kompilierte Templates nach einem neuen Image nicht veralten.
    - storage_logs:/var/www/html/storage/logs
    - storage_uploads:/var/www/html/storage/uploads
    - storage_ratelimit:/var/www/html/storage/ratelimit
  depends_on:
    db:
      condition: service_healthy
  networks:
    - backend

services:
  php:
    <<: *app

  worker:
    <<: *app
    command: ["php", "bin/worker.php"]
    # Aktivierung mit --profile worker, sobald bin/worker.php vorhanden ist
    profiles: ["worker"]

  nginx:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    image: ${HVM_IMAGE:-hvm-website}-web:${HVM_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - php
    networks:
      - backend
      - traefik
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-hvm}.rule=Host(`${APP_HOST:?APP_HOST fehlt}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-hvm}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-hvm}.tls=true"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-hvm}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      # Produktion: Standard (Kompression). Staging: <router>-staging@docker,<router>-compress@docker
      - "traefik.http.routers.${TRAEFIK_ROUTER:-hvm}.middlewares=${TRAEFIK_MIDDLEWARES:-${TRAEFIK_ROUTER:-hvm}-compress@docker}"
      - "traefik.http.services.${TRAEFIK_ROUTER:-hvm}.loadbalancer.server.port=80"
      - "traefik.http.middlewares.${TRAEFIK_ROUTER:-hvm}-compress.compress=true"
      # Staging-Middleware: Basic Auth und X-Robots-Tag (nur wirksam, wenn in TRAEFIK_MIDDLEWARES eingetragen)
      - "traefik.http.middlewares.${TRAEFIK_ROUTER:-hvm}-staging-auth.basicauth.users=${STAGING_BASIC_AUTH:-}"
      - "traefik.http.middlewares.${TRAEFIK_ROUTER:-hvm}-staging-auth.basicauth.realm=Staging"
      - "traefik.http.middlewares.${TRAEFIK_ROUTER:-hvm}-staging-robots.headers.customresponseheaders.X-Robots-Tag=${STAGING_ROBOTS_TAG:-noindex, nofollow}"
      - "traefik.http.middlewares.${TRAEFIK_ROUTER:-hvm}-staging.chain.middlewares=${TRAEFIK_ROUTER:-hvm}-staging-auth,${TRAEFIK_ROUTER:-hvm}-staging-robots"

  # Taegliche verschluesselte Datenbanksicherung (docs/betrieb.md, bin/backup-db.sh).
  # Aktivierung mit --profile backup. Alternative: Cronjob auf dem Host, der
  # "docker compose run --rm backup /app/bin/backup-db.sh" aufruft.
  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    image: ${HVM_IMAGE:-hvm-website}-backup:${HVM_TAG:-latest}
    restart: unless-stopped
    profiles: ["backup"]
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      # Sicherung läuft mit DB_USER, das Root-Passwort bleibt dem Dienst db vorbehalten
      DB_ROOT_PASSWORD: ""
      BACKUP_DIR: /backups
      TZ: Europe/Berlin
    env_file:
      - .env
    volumes:
      - backup_data:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  db:
    image: mariadb:10.11
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    environment:
      MARIADB_DATABASE: ${DB_NAME:?DB_NAME fehlt}
      MARIADB_USER: ${DB_USER:?DB_USER fehlt}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD fehlt}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

networks:
  backend:
    driver: bridge
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

volumes:
  db_data:
  storage_logs:
  storage_uploads:
  storage_ratelimit:
  backup_data:
